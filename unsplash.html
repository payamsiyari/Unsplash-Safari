<!DOCTYPE html>
<html>
<head>
<meta name="color-scheme" content="light dark">
<title>Home</title>
<style>
html {
  --bg-light: #fff;
  --bg-dark: #000;
  --bg: var(--bg-light);

  @media (prefers-color-scheme: dark) {
    --bg: var(--bg-dark);
  }

  @supports (color: light-dark(white, black)) {
    --bg: light-dark(var(--bg-light), var(--bg-dark));
  }

  color-scheme: light dark;
  background-color: var(--bg);
}

body {
  margin: 0;
}

.wallpaper {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.8s ease-out;

  @media (prefers-reduced-motion: reduce) {
    transition-duration: 0.15s;
  }
}

.wallpaper.loaded {
  opacity: 1;
}
</style>
</head>
<body>
<img class="wallpaper" src="https://picsum.photos/3200/1600" alt="" onload="this.classList.add('loaded')">
</body>
</html>
